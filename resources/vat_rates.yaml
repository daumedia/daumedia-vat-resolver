# EU-Mehrwertsteuersätze.
#
# Diese Datei ist die einzige Wahrheit über Steuersätze. Im Code steht kein
# einziger Satz. Ein Update ist ein reiner Datei-Commit — keine Klassenänderung,
# keine Migration, kein Deploy von Logik.
#
# VERIFIKATION VOR DEM LIVEGANG
# Die Werte stammen aus dem Kenntnisstand beim Anlegen der Datei und sind NICHT
# maschinell gegen die Quelle abgeglichen. Vor dem ersten echten Zahlungslauf ist
# jeder `standard`-Satz gegen die TAXUD-Liste zu prüfen und `meta.as_of` neu zu
# setzen. RateTableFreshnessTest schlägt fehl, sobald `as_of` älter als 400 Tage
# ist — das ist Absicht.
#
# `resolve()` verwendet ausschliesslich `standard`. Die ermässigten Sätze stehen
# hier, damit die Naht existiert (RateCategory), sind aber noch von keiner Regel
# angefasst und entsprechend unverifiziert. Wer sie in Betrieb nimmt, prüft sie
# vorher einzeln — ermässigte Sätze hängen an Leistungskategorien, nicht am Land.
#
# Drittländer werden mit `eu: false` GEFÜHRT statt weggelassen: so schlägt ein
# Tippfehler als "unbekanntes Land" fehl, statt still als Drittland durchzurutschen.
meta:
    as_of: '2026-01-01'
    source: 'Europäische Kommission (TAXUD) — VAT rates applied in the Member States of the European Union'
    reference: 'https://ec.europa.eu/taxation_customs/tedb/'
    # Kein home_country hier: das Sitzland gehört dem Aufrufer, nicht der Tabelle.
    # Es kommt als Konstruktor-Parameter in den VatResolver.

countries:
